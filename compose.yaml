name: disttrainbench

x-node: &node
  image: disttrainbench:dev
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  working_dir: /workspace
  command: ["sleep", "infinity"]
  environment:
    DISTTRAINBENCH_WORKER_TOKEN: "${WORKER_TOKEN:-local-development-token}"
    DISTTRAINBENCH_WORKER_PORT: "8765"
  networks:
    - bench
  volumes:
    - ${WORKSPACE_DIR:-./workspace}:/workspace
    - ${TRAIN_DATA_DIR:-./data}:/data
    - ${RUN_OUTPUT_DIR:-./runs}:/runs

services:
  coordinator:
    <<: *node
    cpus: "${COORDINATOR_CPUS:-0.5}"
    mem_limit: "${COORDINATOR_MEMORY:-4g}"
    stdin_open: true
    tty: true
    environment:
      DISTTRAINBENCH_WORKER_TOKEN: "${WORKER_TOKEN:-local-development-token}"
      DISTTRAINBENCH_WORKER_PORT: "8765"

  worker-1:
    <<: *node
    command: ["python", "-m", "disttrainbench.worker"]
    cpus: "${WORKER_CPUS:-0.5}"
    mem_limit: "${WORKER_MEMORY:-4g}"

  worker-2:
    <<: *node
    command: ["python", "-m", "disttrainbench.worker"]
    cpus: "${WORKER_CPUS:-0.5}"
    mem_limit: "${WORKER_MEMORY:-4g}"

networks:
  bench:
    driver: bridge
